<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C1626">
<title>Sign in · Fitzy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/fitzy.css">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">

  <header class="hdr">
    <a class="hdr__back" href="/app/" aria-label="Back" style="color:#fff;text-decoration:none">←</a>
    <img class="hdr__logo" src="/assets/fitzy-badge.svg" alt="Fitzy Mobile Fueling">
  </header>

  <main class="app__body">

    <!-- --------------------------------------------------- step 1: number -->
    <section id="step-phone">
      <h1 class="page-title">Sign in</h1>
      <p class="page-sub">We'll text you a six-digit code. No password to remember.</p>

      <form class="form" id="phone-form" style="margin-top:18px" novalidate>
        <div class="field">
          <label class="field-label" for="phone">Mobile number</label>
          <input class="input" id="phone" type="tel" inputmode="tel"
                 autocomplete="tel" placeholder="(805) 555-1133">
        </div>
        <button class="btn btn--primary" type="submit" id="send">Text me a code</button>
        <p class="btn-reason" id="phone-error" hidden></p>
      </form>

      <p class="help" style="padding:18px 18px 0;text-align:center">
        New to Fitzy? <a href="/app/signup.html">Create an account</a>
      </p>
    </section>

    <!-- ----------------------------------------------------- step 2: code -->
    <section id="step-code" hidden>
      <h1 class="page-title">Enter your code</h1>
      <p class="page-sub" id="sent-to"></p>

      <form class="form" id="code-form" style="margin-top:18px" novalidate>
        <input class="code-input" id="code" type="text" inputmode="numeric"
               autocomplete="one-time-code" maxlength="6" placeholder="------">
        <button class="btn btn--primary" type="submit" id="verify">Verify</button>
        <p class="btn-reason" id="code-error" hidden></p>
        <button class="textlink" type="button" id="resend" style="margin:0 auto">Send a new code</button>
        <button class="textlink" type="button" id="edit" style="margin:0 auto">Use a different number</button>
      </form>

      <!-- request-code answers the same way whether or not the number belongs
           to anyone, so a stranger cannot use it to ask who is a customer.
           That means a wrong number looks like a code that never arrives,
           and this line is what makes that state make sense. -->
      <p class="help" style="padding:18px 18px 0;text-align:center">
        No text after a minute? That number may not have an account yet —
        <a href="/app/signup.html">create one</a>.
      </p>

      <div class="pending" id="dev" hidden style="margin-top:14px"></div>
    </section>

  </main>
  <footer class="band"></footer>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
let phone = '';

$('phone').addEventListener('input', (e) => {
  const d = e.target.value.replace(/\D/g, '').slice(0, 10);
  e.target.value = d.length > 6 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`
    : d.length > 3 ? `(${d.slice(0,3)}) ${d.slice(3)}`
    : d.length ? `(${d}` : '';
});

$('code').addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
  if (e.target.value.length === 6) $('code-form').requestSubmit();
});

const err = (id, msg) => {
  const e = $(id);
  if (!msg) { e.hidden = true; return; }
  e.textContent = msg;
  e.hidden = false;
};

const showStep = (which) => {
  $('step-phone').hidden = which !== 'phone';
  $('step-code').hidden = which !== 'code';
  if (which === 'code') $('code').focus();
};

async function requestCode(btn) {
  err('phone-error', null);
  const digits = $('phone').value.replace(/\D/g, '');
  if (digits.length < 10) return err('phone-error', 'Enter a ten-digit mobile number.');

  phone = digits;
  btn.disabled = true;
  const was = btn.textContent;
  btn.textContent = 'Sending…';
  try {
    const res = await fetch('/api/auth/request-code', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ phone }),
    });
    const data = await res.json();
    if (!res.ok) return err('phone-error', data.error || 'Could not send a code.');

    $('sent-to').textContent = `Sent to ${data.sent_to}. It expires in ${data.expires_in_minutes} minutes.`;
    if (data.dev_code) {
      $('dev').hidden = false;
      $('dev').textContent = `Development: your code is ${data.dev_code}`;
    }
    showStep('code');
  } catch {
    err('phone-error', 'Network problem. Try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = was;
  }
}

$('phone-form').addEventListener('submit', (e) => { e.preventDefault(); requestCode($('send')); });
$('resend').addEventListener('click', () => requestCode($('resend')));
$('edit').addEventListener('click', () => {
  $('code').value = ''; $('dev').hidden = true; err('code-error', null); showStep('phone');
});

$('code-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = $('code').value.trim();
  if (code.length !== 6) return err('code-error', 'Enter all six digits.');

  const btn = $('verify');
  btn.disabled = true;
  btn.textContent = 'Checking…';
  err('code-error', null);
  try {
    const res = await fetch('/api/auth/verify-code', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ phone, code }),
    });
    const data = await res.json();
    if (!res.ok) {
      err('code-error', data.error || 'That code did not work.');
      $('code').value = '';
      $('code').focus();
      return;
    }

    // An owner signing in here belongs in ops, not in the customer app.
    if (data.is_owner) { location.href = '/ops/'; return; }

    // Land wherever they actually left off rather than always on the home
    // screen, which would be a dead end for a half-finished signup.
    const me = await fetch('/api/account/me');
    if (!me.ok) { location.href = '/app/home.html'; return; }
    const next = (await me.json()).needs[0];
    location.href =
      next === 'waiver'     ? '/app/waiver.html'
      : next === 'vehicle'  ? '/app/vehicle.html'
      : next === 'location' ? '/app/location.html'
      : '/app/home.html';
  } catch {
    err('code-error', 'Network problem. Try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Verify';
  }
});

// Already signed in — no reason to show this screen at all.
try {
  const res = await fetch('/api/account/me');
  if (res.ok) location.replace('/app/');
} catch { /* not signed in; this is the right screen */ }

showStep('phone');
$('phone').focus();
</script>
</body>
</html>
