<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Fitzy Ops</title>
<link rel="icon" href="/assets/icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/icons/icon-16.png" sizes="16x16" type="image/png">
<!-- iOS applies its own rounded mask, so this one is a full-bleed square
     with no transparency; the pre-rounded icon would go black at the
     corners. -->
<link rel="apple-touch-icon" href="/assets/icons/icon-apple-180.png">
<!-- use-credentials so the manifest fetch carries the visitor's cookies.
     Without it the browser fetches it anonymously, which behind an auth
     gate gets redirected and drops "Add to Home Screen" back to a
     generic icon. -->
<link rel="manifest" href="/app.webmanifest" crossorigin="use-credentials">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/fitzy.css">
<link rel="stylesheet" href="/assets/ops.css">
<style>
  .wrap { max-width: 420px; margin: 0 auto; }
  .code-in { width: 100%; height: 64px; text-align: center; letter-spacing: 14px;
             font: 700 30px 'Barlow', sans-serif; font-variant-numeric: tabular-nums;
             background: #fff; border: 1px solid var(--border); border-radius: 32px;
             color: var(--navy-ink); padding-left: 14px; }
  .code-in:focus { outline: 0; border: 2px solid var(--amber); }
  .dev { margin-top: 14px; border: 1.5px dashed var(--amber-dash); border-radius: 10px;
         padding: 10px 12px; font-size: 13px; color: var(--amber-ink); }
</style>
</head>
<body>
<div class="ops">
  <header class="ops-bar"><span class="ops-bar__title">Fitzy Ops</span></header>

  <main class="ops-main wrap">
    <div class="card">

      <section id="step-phone">
        <h1 class="page-title" style="margin-bottom:8px">Sign in</h1>
        <p class="help">We'll text you a six-digit code.</p>
        <form class="ops-form" id="phone-form" style="margin-top:16px" novalidate>
          <div class="ops-field">
            <label class="ops-field__label" for="phone">Mobile number</label>
            <input class="input" id="phone" type="tel" inputmode="tel"
                   autocomplete="tel" placeholder="(805) 555-1133">
          </div>
          <button class="btn btn--primary" type="submit" id="send">Text me a code</button>
          <p class="btn-reason" id="phone-error" hidden></p>
        </form>
      </section>

      <section id="step-code" hidden>
        <h1 class="page-title" style="margin-bottom:8px">Enter your code</h1>
        <p class="help" id="sent-to"></p>
        <form class="ops-form" id="code-form" style="margin-top:16px" novalidate>
          <input class="code-in" id="code" type="text" inputmode="numeric"
                 autocomplete="one-time-code" maxlength="6" placeholder="------">
          <button class="btn btn--primary" type="submit" id="verify">Verify</button>
          <p class="btn-reason" id="code-error" hidden></p>
          <button class="textlink" type="button" id="resend" style="margin:0 auto">Send a new code</button>
          <button class="textlink" type="button" id="back" style="margin:0 auto">Use a different number</button>
        </form>
        <div class="dev" id="dev" hidden></div>
      </section>

    </div>
  </main>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
let phone = '';

const show = (which) => {
  $('step-phone').hidden = which !== 'phone';
  $('step-code').hidden = which !== 'code';
  if (which === 'code') $('code').focus();
};

const err = (id, msg) => {
  const e = $(id);
  if (!msg) { e.hidden = true; return; }
  e.textContent = msg;
  e.hidden = false;
};

// Format as the US number is typed. Purely cosmetic — the server
// normalizes to E.164 regardless of what shape it arrives in.
$('phone').addEventListener('input', (e) => {
  const d = e.target.value.replace(/\D/g, '').slice(0, 10);
  e.target.value = d.length > 6 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`
    : d.length > 3 ? `(${d.slice(0,3)}) ${d.slice(3)}`
    : d.length ? `(${d}` : '';
});

$('code').addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
  if (e.target.value.length === 6) $('code-form').requestSubmit();
});

async function requestCode(btn) {
  err('phone-error', null);
  err('code-error', null);
  btn.disabled = true;
  const was = btn.textContent;
  btn.textContent = 'Sending…';
  try {
    const res = await fetch('/api/auth/request-code', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ phone, scope: 'ops' }),
    });
    const data = await res.json();
    if (!res.ok) {
      err($('step-code').hidden ? 'phone-error' : 'code-error', data.error || 'Could not send a code.');
      return false;
    }
    $('sent-to').textContent = `Sent to ${data.sent_to}. It expires in ${data.expires_in_minutes} minutes.`;
    // Local development only — the server returns this when SMS is not
    // configured, and never outside the development environment.
    if (data.dev_code) {
      $('dev').hidden = false;
      $('dev').textContent = `Development: your code is ${data.dev_code}. ${data.dev_note}`;
    }
    show('code');
    return true;
  } catch {
    err('phone-error', 'Network problem. Try again.');
    return false;
  } finally {
    btn.disabled = false;
    btn.textContent = was;
  }
}

$('phone-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const digits = $('phone').value.replace(/\D/g, '');
  if (digits.length < 10) { err('phone-error', 'Enter a ten-digit mobile number.'); return; }
  phone = digits;
  await requestCode($('send'));
});

$('resend').addEventListener('click', () => requestCode($('resend')));

$('back').addEventListener('click', () => {
  $('code').value = '';
  $('dev').hidden = true;
  err('code-error', null);
  show('phone');
});

$('code-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = $('code').value.trim();
  if (code.length !== 6) { err('code-error', 'Enter all six digits.'); return; }

  const btn = $('verify');
  btn.disabled = true;
  btn.textContent = 'Checking…';
  err('code-error', null);
  try {
    const res = await fetch('/api/auth/verify-code', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ phone, code, scope: 'ops' }),
    });
    const data = await res.json();
    if (!res.ok) {
      err('code-error', data.error || 'That code did not work.');
      $('code').value = '';
      $('code').focus();
      return;
    }
    location.href = '/ops/';
  } catch {
    err('code-error', 'Network problem. Try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Verify';
  }
});

show('phone');
$('phone').focus();
</script>
</body>
</html>
